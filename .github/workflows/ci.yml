# lint → 라우트 타입 생성 → 타입 검사 → 빌드. PR마다 돌고, develop에 병합되면 배포 워크플로(deploy.yml)가 배포 전에
# 이 워크플로를 부른다. 그래서 같은 커밋을 두 번 검사하지 않는다(develop·main 푸시에 따로 돌지 않는다).
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_call:

# PR에 새 커밋이 오면 그 PR의 이전 실행은 취소한다. 배포에서 부를 때는 실행마다 따로라 취소하지 않는다.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: lint
        run: npm run lint

      # 서버 응답 타입(src/lib/api-schema.d.ts)은 저장소의 서버 명세(openapi/server.json)에서 만든다. 손으로 고쳤거나
      # 명세만 바꾸고 다시 만들지 않았으면 실패한다(npm run api:types로 다시 만든다)
      - name: 서버 응답 타입이 명세와 같은지
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api-schema.d.ts

      # LayoutProps·PageProps 같은 라우트 타입은 next가 만들어 준다. 먼저 만들어야 tsc가 통과한다.
      - name: 라우트 타입 생성 + 타입 검사
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: 빌드
        run: npm run build

      # 서버 develop의 최신 명세로 타입을 다시 만들어 검사한다. 서버가 웹이 쓰는 응답 필드를 바꾸거나 지웠으면 여기서 깨진다.
      # PR에서만 돈다(배포는 막지 않는다). 명세가 바뀌기만 하고 타입은 맞으면 경고만 남긴다(npm run api:sync로 맞춘다)
      - name: 서버 최신 응답 명세로 타입 검사
        if: github.event_name == 'pull_request'
        run: |
          cp openapi/server.json "$RUNNER_TEMP/server.json"
          npm run api:sync
          npx tsc --noEmit
          if ! cmp -s openapi/server.json "$RUNNER_TEMP/server.json"; then
            echo "::warning::서버 develop의 응답 명세가 이 저장소의 openapi/server.json과 다르다. npm run api:sync로 맞추는 PR을 올린다"
          fi
