# 지속 배포: develop에 병합(푸시)되면 사람 손 없이 서버까지 나간다.
#   검사(ci.yml)와 이미지(GHCR, 이름표는 커밋 해시 sha-1a2b3c4)를 동시에 만들고, 둘 다 성공하면
#   서버 무중단 교체(korleaguer-server의 deploy/korleaguer-deploy) → 공개 주소의 /healthz가 그 커밋을 주는지 바깥에서 확인
#   → 성공하면 main을 배포한 커밋에 맞춘다.
# 같은 코드를 두 번 검사하지 않는다: 병합한 커밋의 코드(트리)가 그 PR 마지막 커밋과 똑같고 그 커밋의 CI가 통과했으면
# 검사를 건너뛴다(squash 병합 전에 PR이 develop 끝을 담고 있었던 경우. 아니면 지금처럼 검사한다).
# 최신만 배포한다: 배포 차례가 왔을 때 develop에 더 새 배포 대상 커밋이 있으면 이 실행은 배포하지 않는다
# (그 커밋의 배포가 이 변경까지 함께 내보낸다). 그래서 차례가 뒤바뀌어도 옛 코드가 새 코드를 덮지 않는다.
# 배포는 커밋 해시로 구분한다(따로 버전 번호를 두지 않는다). 배포 기록은 Actions의 deploy 실행 목록이다.
# 새 컨테이너가 정상(healthy)이 안 되면 서버는 옛 것을 그대로 둔다. 다만 SSH가 끊기거나 '바깥에서 확인'이 실패해 job이
# 빨간불이어도 서버는 이미 새 커밋일 수 있다(공개 주소의 /healthz가 주는 커밋으로 확인).
# 실패하면 고친 뒤 다시 병합하거나 그 실행을 '다시 실행'한다. 다시 실행은 그 커밋이 아직 develop 끝일 때만 배포한다
# (그 뒤 커밋들이 배포하지 않는 파일만 바꿨으면 괜찮다. 그 사이 더 새 커밋이 나갔을 수 있어서다).
# 배포 단계가 시작된 뒤 실행을 취소해도 서버는 교체를 끝까지 한다(실행은 '취소됨', main은 맞추지 않는다).
# 문서만 바뀐 푸시(*.md, .impeccable/)는 배포하지 않는다.
# 되돌리기: Actions → deploy → Run workflow에 되돌릴 커밋(예 1a2b3c4)을 넣으면 그 커밋의 이미지로 다시 배포한다
# (서버에 최근 3개 이미지가 있고, 그보다 오래된 것은 GHCR에서 받는다). 되돌리기는 main을 옮기지 않는다.
# 되돌리기 실행은 '다시 실행'하지 않는다(그 사이 나간 새 배포를 덮지 않게 막는다). 다시 하려면 Run workflow로 새로 건다.
#
# 필요한 값(저장소 Settings → Secrets and variables → Actions). 서버 준비와 자세한 안내는
# korleaguer-server 저장소의 deploy/README.md.
#   secret   DEPLOY_SSH_KEY       배포 계정용 SSH 개인키(이 저장소 전용, 서버에서는 'web 배포'만 할 수 있게 묶여 있다)
#   variable DEPLOY_HOST          서버 주소(예: pigeon.ddns.net)
#   variable DEPLOY_KNOWN_HOSTS   서버 호스트 키 한 줄(server-setup.sh가 출력). 처음 보는 서버에는 접속하지 않는다
#   variable DEPLOY_PORT          SSH 포트(없으면 22)
#   variable DEPLOY_PLATFORM      서버 CPU(linux/amd64 또는 linux/arm64, 없으면 linux/amd64). arm64면 ARM 러너에서 바로 만든다
#   variable SITE_URL             공개 주소(없으면 https://DEPLOY_HOST). 배포 뒤 /healthz를 본다
#   variable NEXT_PUBLIC_TEAM_LOGOS  off면 팀 로고 대신 팀 색 점(빌드할 때 코드에 박힌다). 없으면 로고를 쓴다
name: deploy

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '.impeccable/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      commit:
        description: 되돌리거나 다시 배포할 커밋(예 1a2b3c4). 이 워크플로가 그 커밋으로 만든 이미지가 있어야 한다
        required: true

# 줄 서기는 '서버에 배포' 잡에만 둔다(아래 deploy.concurrency). 검사·이미지 만들기는 앞 배포를 기다리지 않고 바로 돈다.

permissions:
  contents: read

env:
  IMAGE: ghcr.io/korleaguer/korleaguer-web

jobs:
  # PR에서 이미 통과한 코드인지 본다. 확인하다 오류가 나면 '아니다'로 보고 검사한다(검사 없이 배포하지 않는다).
  reuse:
    name: 같은 코드 검사 기록 찾기
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      tested: ${{ steps.find.outputs.tested }}
    steps:
      - name: PR 마지막 커밋과 코드가 같고 CI가 통과했나
        id: find
        run: |
          set +e
          tested=false
          tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${GITHUB_SHA}" -q .tree.sha)"
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            -q "[.[] | select(.merge_commit_sha == \"${GITHUB_SHA}\")][0].head.sha // empty")"
          if [ -n "$tree" ] && [ -n "$head" ]; then
            head_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${head}" -q .tree.sha)"
            passed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${head}&event=pull_request&status=success&per_page=1" -q .total_count)"
            if [ "$tree" = "$head_tree" ] && [ "${passed:-0}" -gt 0 ] 2> /dev/null; then
              tested=true
            fi
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          if [ "$tested" = true ]; then
            echo "PR 마지막 커밋 ${head::7}과 코드가 같고 그 CI가 통과해 검사를 건너뜁니다" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "PR 마지막 커밋(${head:-없음})과 코드가 다르거나 통과한 CI가 없어 검사합니다" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    name: 검사
    needs: reuse
    if: github.event_name == 'push' && needs.reuse.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml

  # 검사와 동시에 돈다. 검사가 실패하면 이미지는 올라가도 배포하지 않는다.
  build:
    name: 이미지 만들기
    if: github.event_name == 'push'
    runs-on: ${{ vars.DEPLOY_PLATFORM == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 이미지 이름표(커밋 해시)
        id: tag
        run: |
          echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 이름표는 sha-1a2b3c4 하나다. latest는 쓰지 않는다(무엇이 나가 있는지 늘 커밋으로 안다).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}

      # SBOM(이미지에 든 패키지 목록)과 출처 증명(어느 커밋·워크플로가 만들었나)을 이미지와 함께 올린다.
      # APP_COMMIT은 /healthz가 돌려주는 커밋이다(배포 뒤 바깥 확인에 쓴다).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_TEAM_LOGOS=${{ vars.NEXT_PUBLIC_TEAM_LOGOS }}
            APP_COMMIT=${{ steps.tag.outputs.commit }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 서버에 배포
    needs: [reuse, test, build]
    # 병합이면 이미지가 만들어지고 검사가 통과(또는 PR에서 같은 코드가 통과)했을 때, 수동 실행(되돌리기)이면
    # 검사·이미지 만들기를 건너뛰고 바로 배포한다. 실행을 취소하면 배포하지 않는다(배포 단계가 이미 시작됐으면
    # 서버는 교체를 끝까지 한다).
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.build.result == 'success' &&
      (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.reuse.outputs.tested == 'true')))) }}
    runs-on: ubuntu-24.04
    # 서버는 앞 배포를 최대 10분 기다리고(잠금), 새 자리가 healthy(최대 5분)·데워지기(최대 3분)를 기다린다(블루-그린)
    timeout-minutes: 25
    # 배포는 한 번에 하나씩, 도는 중인 배포는 끊지 않는다. 기다리는 배포는 취소하지 않는다(queue: max, 최대 100개).
    # 그래서 되돌리기도 뒤에 온 병합에 밀려 취소되지 않는다. 서버에서도 두 저장소의 배포가 겹치지 않게 잠근다(korleaguer-deploy).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: read
    outputs:
      deployed: ${{ steps.done.outputs.deployed }}
    steps:
      # 병합 배포는 develop 끝(또는 그 뒤 커밋들이 배포하지 않는 파일만 바꾼 커밋)만 내보낸다.
      # - 첫 실행: 더 새 배포 대상 커밋이 있으면 건너뛴다(그 배포가 이 변경까지 내보낸다). 실행은 성공으로 끝난다.
      # - 다시 실행: 그 사이 나간 새 배포를 옛 코드로 덮을 수 있어 실패로 알린다(지금까지와 같다).
      # - 되돌리기(수동 실행): 다시 실행하지 않는다. Run workflow로 새로 건다.
      - name: 최신 커밋인지 확인
        id: latest
        run: |
          api() { for _ in 1 2 3; do gh api "$@" && return 0; sleep 3; done; return 1; }
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$ATTEMPT" != 1 ]; then
              echo "::error::되돌리기(수동 실행)는 다시 실행하지 않습니다(그 사이 나간 새 배포를 덮을 수 있어서). Actions → deploy → Run workflow로 새로 거세요"
              exit 1
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip="$(api "repos/${GITHUB_REPOSITORY}/commits/develop" -q .sha)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "develop 끝이 이 커밋이라 배포합니다"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cmp="$(api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${tip}")"
          changed="$(jq -r '.files[] | .filename, (.previous_filename // empty)' <<< "$cmp")"
          code="$(grep -vE "$IGNORED" <<< "$changed" || true)"
          if [ "$(jq -r .status <<< "$cmp")" = ahead ] && [ "$(jq '.files | length' <<< "$cmp")" -lt 300 ] && [ -z "$code" ]; then
            echo "develop 끝(${tip::7})까지 배포하지 않는 파일만 바뀌어 이 커밋을 배포합니다"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ATTEMPT" != 1 ]; then
            echo "::error::이 커밋(${GITHUB_SHA::7}) 뒤로 배포되는 커밋이 develop에 있어(끝 ${tip::7}) 다시 실행으로는 배포하지 않습니다. 이 커밋을 꼭 내야 하면 deploy를 Run workflow로 실행하고 commit에 ${GITHUB_SHA::7}을 넣으세요"
            exit 1
          fi
          echo "::notice::develop에 더 새 커밋(${tip::7})이 있어 이 실행은 배포하지 않습니다. 그 커밋의 배포가 이 변경까지 함께 내보냅니다"
          echo "### 배포 건너뜀: 더 새 커밋 ${tip::7}이 이 변경까지 함께 내보낸다" >> "$GITHUB_STEP_SUMMARY"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          # 배포하지 않는 파일. 위 on.push.paths-ignore와 같게 유지한다.
          IGNORED: '\.md$|^\.impeccable/|^\.github/ISSUE_TEMPLATE/'

      - name: 배포할 이미지
        id: tag
        if: steps.latest.outputs.skip != 'true'
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            commit="$(printf '%s' "${INPUT_COMMIT#sha-}" | tr 'A-F' 'a-f')"
            [[ "$commit" =~ ^[0-9a-f]{7,40}$ ]] || { echo "커밋 해시(예 1a2b3c4)가 아닙니다: $INPUT_COMMIT"; exit 1; }
            tag="sha-${commit:0:7}"
          else
            tag="$BUILT_TAG"
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=${tag#sha-}" >> "$GITHUB_OUTPUT"
          echo "배포할 이미지: ${IMAGE}:${tag}"
        env:
          EVENT: ${{ github.event_name }}
          INPUT_COMMIT: ${{ inputs.commit }}
          BUILT_TAG: ${{ needs.build.outputs.tag }}

      - name: SSH 준비
        if: steps.latest.outputs.skip != 'true'
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "DEPLOY_SSH_KEY·DEPLOY_HOST·DEPLOY_KNOWN_HOSTS를 먼저 등록하세요(korleaguer-server의 deploy/README.md)"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}

      # 서버는 이 키로 'korleaguer-deploy web'만 실행한다. 보내는 명령은 이미지 이름표뿐이고,
      # 표준입력으로 이 job의 임시 토큰(packages:read)을 넘겨 GHCR에서 이미지를 받게 한다(job이 끝나면 만료).
      # 서버가 새 컨테이너를 옛 것과 겹쳐 띄워 healthy가 되면 바꾸고, 안 되면 옛 것을 그대로 둔다.
      - name: 배포
        if: steps.latest.outputs.skip != 'true'
        run: |
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "deploy@${DEPLOY_HOST}" "$TAG"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          TAG: ${{ steps.tag.outputs.value }}

      - name: SSH 키 지우기
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # 인터넷 → (nginx) → Caddy → 웹 길로 배포한 커밋이 실제로 나오는지 본다.
      # 교체가 끝난 뒤의 확인이라, 여기서 실패해도 서버는 이미 새 커밋일 수 있다(길 중간의 nginx·Caddy 문제일 수 있다).
      - name: 바깥에서 확인
        if: steps.latest.outputs.skip != 'true'
        run: |
          base="${SITE_URL:-https://${DEPLOY_HOST}}"
          url="${base%/}/healthz"
          want="ok ${COMMIT}"
          got=""
          for _ in $(seq 1 20); do
            got="$(curl -fsS --max-time 10 "$url" 2> /dev/null || true)"
            if [ "$got" = "$want" ]; then
              echo "확인: $url → $got"
              exit 0
            fi
            sleep 3
          done
          echo "::error::$url 이 '$want'를 주지 않습니다(받은 값: ${got:-없음}). 서버 교체는 이미 끝났을 수 있으니 서버 상태부터 확인하세요"
          exit 1
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          COMMIT: ${{ steps.tag.outputs.commit }}

      - name: 요약
        id: done
        if: steps.latest.outputs.skip != 'true'
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "### 웹 되돌리기 배포 완료: ${TAG} (main은 옮기지 않는다)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 웹 배포 완료: ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.tag.outputs.value }}

  main:
    name: main을 배포한 커밋에 맞추기
    needs: deploy
    # 건너뛴 배포(더 새 커밋이 내보냄)는 main을 옮기지 않는다. main은 '병합으로 마지막에 배포한 코드'다.
    # !cancelled()가 있어야 검사를 건너뛴 배포(PR에서 같은 코드가 통과)에서도 돈다. 상태 함수가 없으면 GitHub이
    # success()를 붙이는데, success()는 서버에 배포가 성공해도 그 앞의 검사가 건너뛰어졌으면 거짓이라 이 잡까지 건너뛰었다.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.deploy.result == 'success' &&
      needs.deploy.outputs.deployed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # main은 '병합으로 마지막에 배포한 코드'다. 배포한 커밋을 main에 병합해 둔다(이미 들어 있으면 그대로).
      # 되돌리기(수동 실행)는 main을 옮기지 않는다(강제 푸시를 하지 않는다). 그때 서버의 커밋은 /healthz와 deploy 실행 목록이 정답이다.
      # 병합에 실패하면 이 job만 빨간불로 끝낸다(경고만 남기면 아무도 못 본다). 배포는 이미 끝났으니 main만 맞추면 된다
      # (그냥 두어도 다음 병합 배포가 main을 함께 맞춘다).
      - name: main에 병합
        run: |
          if ! gh api -X POST "repos/${GITHUB_REPOSITORY}/merges" \
            -f base=main -f head="$GITHUB_SHA" \
            -f commit_message="chore(deploy): ${GITHUB_SHA::7} 배포를 main에 반영" --silent; then
            echo "::error::main에 병합하지 못했습니다. 배포는 끝났으니 main만 직접 맞추세요"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
